<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Premium Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #fff; padding: 50px; text-align: center; }
        .container { background: #1e293b; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: inline-block; min-width: 400px; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        select, button { padding: 12px; font-size: 16px; margin: 10px 0; border-radius: 8px; width: 100%; box-sizing: border-box; }
        select { background: #334155; color: white; border: 1px solid #475569; }
        button { background-color: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #0369a1; }
        .result { margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 8px; font-size: 18px; font-weight: bold; color: #22c55e; border: 1px solid #1e293b; word-break: break-all; }
        .date { font-size: 13px; color: #94a3b8; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 IPTV Smart Code Generator</h1>
    <p>Cloud Control Panel Connected to Application & Database</p>
    
    <label style="display:block; text-align:left; margin-bottom:5px; color:#cbd5e1;">Select Plan Duration:</label>
    <select id="duration">
        <option value="24h">24 Hours Free Trial - Test Quality</option>
        <option value="1m">1 Month (30 Days) - Full HD Quality</option>
        <option value="3m">3 Months (90 Days) - Premium VIP Quality</option>
        <option value="6m">6 Months (180 Days) - 4K VIP Quality</option>
        <option value="12m">12 Months (365 Days) - 4K Ultra VIP</option>
    </select>
    
    <button onclick="generateAndSaveCode()">Generate & Save Code 🔑</button>
    
    <div id="output" class="result" style="display:none;"></div>
</div>

<script>
function generateAndSaveCode() {
    const duration = document.getElementById('duration').value;
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let part1 = '', part2 = '';
    
    for (let i = 0; i < 4; i++) {
        part1 += chars.charAt(Math.floor(Math.random() * chars.length));
        part2 += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    
    const finalCode = `ISHAK-${part1}-${part2}`;
    
    const expireDate = new Date();
    if (duration === "24h") {
        expireDate.setHours(expireDate.getHours() + 24);
    } else if (duration === "1m") {
        expireDate.setDate(expireDate.getDate() + 30);
    } else if (duration === "3m") {
        expireDate.setDate(expireDate.getDate() + 90);
    } else if (duration === "6m") {
        expireDate.setDate(expireDate.getDate() + 180);
    } else if (duration === "12m") {
        expireDate.setDate(expireDate.getDate() + 365);
    }
    
    const formattedDate = expireDate.toLocaleString('en-US', { timeZone: 'Africa/Algiers' });
    
    const outputDiv = document.getElementById('output');
    outputDiv.style.display = 'block';
    outputDiv.innerHTML = `Saved to Cloud Successfully! 🎉<br><span style="color:#fff;">CODE:</span> ${finalCode}<br><span class="date">Expires on: ${formattedDate}</span>`;
    
    // إرسال كود فوري ومستقر للسيرفر بدون أي تأخير للمتصفح
    const serverURL = "https://firebasedatabase.app" + finalCode + ".json";
    fetch(serverURL, {
        method: "PUT",
        body: JSON.stringify({ status: "unused", expire_at: formattedDate, duration: duration }),
        headers: { "Content-Type": "application/json" }
    }).catch(e => console.log(e));
}
</script>

</body>
</html>
